name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: node scripts/gen.mjs --check
      - run: node scripts/check-deps.mjs
      - run: deno check src/
      - run: node --experimental-strip-types --no-warnings --test --test-timeout=20000 test/*.test.ts
      - run: node scripts/build.mjs
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Playwright is a dev-only test tool; it is never a dependency of the package.
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.63.0 && npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/build.mjs
      - run: PLAYWRIGHT_PATH=/tmp/pw/node_modules node e2e/run.mjs
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno publish
