name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: node scripts/gen.mjs --check
      - run: node scripts/check-deps.mjs
      - run: deno check src/
      - run: node --experimental-strip-types --no-warnings --test --test-timeout=20000 test/*.test.ts
      - run: node scripts/build.mjs
      # the published types as an Angular 15 app sees them (TypeScript 4.8, moduleResolution "node")
      - run: mkdir -p /tmp/ts && cd /tmp/ts && npm init -y >/dev/null && npm i typescript@5
      - run: TS_PATH=/tmp/ts/node_modules/typescript node scripts/build-types.mjs
      - run: node scripts/check-compat.mjs
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Playwright is a dev-only test tool; it is never a dependency of the package.
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.63.0 && npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/build.mjs
      - run: mkdir -p /tmp/ts && cd /tmp/ts && npm init -y >/dev/null && npm i typescript@5
      - run: TS_PATH=/tmp/ts/node_modules/typescript node scripts/build-types.mjs
      # host apps: Angular 15 (Envizom's versions) and Svelte 5, built against this checkout
      - run: cd examples/angular15 && npm ci --no-audit --no-fund && NG_CLI_ANALYTICS=false npm run build:e2e
      - run: cd examples/svelte5 && npm ci --no-audit --no-fund && npm run build:e2e
      - run: REQUIRE_HOSTS=1 PLAYWRIGHT_PATH=/tmp/pw/node_modules node e2e/run.mjs
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno publish
