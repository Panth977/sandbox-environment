<!doctype html>
<html>
<head><meta charset="utf-8"><title>e2e: UI kit gallery</title><style>body{margin:0;background:#ddd}</style></head>
<body>
<div id="slot"></div>
<script type="module">
import { compile } from "/dist/compiler/mod.js";
import { mount } from "/dist/host/mod.js";
const R = (window.__results = { done: false, errors: [] });
const src = await (await fetch("/examples/gallery.js")).text();
const r = await compile({ "/index.js": src });
R.diagnostics = r.diagnostics.map((d) => d.message);
const params = new URLSearchParams(location.search);
const h = mount(document.getElementById("slot"), {
  artifact: r.artifact,
  theme: { mode: params.get("dark") ? "dark" : "light" },
  api: { report: (o) => Object.assign(R, o) },
  onError: (e) => R.errors.push(e.message),
});
await h.ready;
for (let i = 0; i < 50 && !R.galleryReady; i++) await new Promise((r) => setTimeout(r, 100));
R.done = true;
</script>
</body>
</html>
